<div id="flags-grid" class="flags-grid"></div>

<script>
const baseurl = '/conflicts-in-figures';
fetch('/conflicts-in-figures/assets/data/countries.json')
  .then(res => res.json())
  .then(countries => {
    const grid = document.getElementById('flags-grid');
    grid.innerHTML = countries.map(c => `
      <a href="/conflicts-in-figures/country.html?code=${c.code}" class="flag-card">
        <img src="/conflicts-in-figures${c.flag}" alt="${c.name} flag">
        <p>${c.name}</p>
      </a>
    `).join('');
  });
</script>
